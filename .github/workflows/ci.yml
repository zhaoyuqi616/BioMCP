name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-mvp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --frozen --extra dev --extra pilot --extra browser
      - run: uv run --frozen python scripts/check.py
      - run: uv run --frozen python tutorials/validate_mcp.py --output validation-report.json
      - if: matrix.python == '3.11'
        run: |
          uv run --frozen playwright install --with-deps chromium
          uv run --frozen python scripts/browser_smoke.py
          sudo apt-get update && sudo apt-get install -y redis-server
          uv run --frozen python scripts/redis_drill.py
