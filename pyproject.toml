[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ensembl-uniprot-mcp"
version = "0.8.0"
description = "Open-source MCP server exposing Ensembl and UniProt sequence lookup tools for biological research agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Open Biomedical Agents Community" }]
keywords = ["mcp", "model-context-protocol", "ensembl", "uniprot", "bioinformatics", "llm-agents"]
dependencies = [
  "mcp>=1.7.0,<2.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "tenacity>=8.2.3",
  "python-dotenv>=1.0.1",
  "gradio>=4.44,<7",
  "plotly>=5,<7",
  "bcrypt>=4.0"
]

[project.optional-dependencies]
pilot = ["fastapi", "uvicorn", "PyJWT[crypto]>=2.10,<3", "redis>=5,<7"]
browser = ["playwright>=1.50,<2"]
coordination = ["redis>=5.0,<7"]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[project.scripts]
ensembl-uniprot-mcp = "ensembl_uniprot_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ensembl_uniprot_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
